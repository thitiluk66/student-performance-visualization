<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Factors</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div class="container">

    <h1>Student Performance Factors</h1>

    <div class="dashboard">

        <div class="card">
            <h2>1. Correlation Analysis</h2>
            <div id="scatter-chart"></div>
        </div>

        <div class="card">
            <h2>2. Attendance Analysis</h2>
            <div id="line-chart"></div>
        </div>

        <div class="card">
            <h2>3. Family Income Analysis</h2>
            <div id="bar-chart"></div>
        </div>

        <div class="card">
            <h2>4. Family Income Analysis</h2>
            <div id="motivation-chart"></div>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
